<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 3: NBA Match Prediction - Real-time Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 300;
            background-color: #F7F4EF;
            color: #1F2421;
            line-height: 1.6;
        }

        .nav {
            position: sticky;
            top: 0;
            background: rgba(251, 249, 245, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #E7E1D7;
            padding: 1rem 2rem;
            z-index: 100;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .nav-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        .nav-title em {
            font-style: italic;
            color: #C4612F;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 1.5rem;
        }

        .nav-links a {
            color: #5C635D;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #C4612F;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.5em;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #1F2421;
        }

        .header h1 em {
            font-style: italic;
            color: #C4612F;
        }

        .header p {
            font-size: 1.1em;
            color: #5C635D;
        }

        .main-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5em;
            font-weight: 400;
            color: #1F2421;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E7E1D7;
        }

        .team-selection {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
        }

        .team-selector {
            background: #F7F4EF;
            padding: 20px;
            border-radius: 8px;
        }

        .team-selector label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1F2421;
        }

        .team-selector select {
            width: 100%;
            padding: 12px;
            border: 1px solid #E7E1D7;
            border-radius: 6px;
            font-size: 1em;
            background: white;
            transition: all 0.3s;
        }

        .team-selector select:focus {
            outline: none;
            border-color: #C4612F;
            box-shadow: 0 0 0 3px rgba(196, 97, 47, 0.1);
        }

        .vs-divider {
            font-size: 2em;
            font-weight: 600;
            color: #C4612F;
            text-align: center;
        }

        .predict-btn {
            width: 100%;
            padding: 15px;
            background: #C4612F;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .predict-btn:hover:not(:disabled) {
            background: #A84E25;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(196, 97, 47, 0.3);
        }

        .predict-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .players-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .team-players {
            background: #F7F4EF;
            padding: 20px;
            border-radius: 8px;
        }

        .team-players h3 {
            color: #C4612F;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: 500;
        }

        .player-card {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #E7E1D7;
        }

        .player-name {
            font-weight: 500;
            color: #1F2421;
        }

        .player-position {
            background: #C4612F;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .search-results {
            margin-top: 30px;
        }

        .search-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .search-section {
            background: #F7F4EF;
            padding: 20px;
            border-radius: 8px;
        }

        .search-section h4 {
            color: #1F2421;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .search-content {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #C4612F;
            line-height: 1.6;
            color: #5C635D;
            height: 400px;
            overflow-y: auto;
        }

        .search-content::-webkit-scrollbar {
            width: 8px;
        }

        .search-content::-webkit-scrollbar-track {
            background: #F7F4EF;
            border-radius: 4px;
        }

        .search-content::-webkit-scrollbar-thumb {
            background: #C4612F;
            border-radius: 4px;
        }

        .search-content::-webkit-scrollbar-thumb:hover {
            background: #A84E25;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #E7E1D7;
            border-top: 3px solid #C4612F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .prediction-result {
            background: linear-gradient(135deg, #C4612F 0%, #A84E25 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-top: 30px;
            text-align: center;
        }

        .prediction-result h3 {
            font-size: 2em;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .win-probability {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .prob-card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .prob-value {
            font-size: 3em;
            font-weight: 600;
        }

        .analysis-text {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            line-height: 1.8;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-searching {
            background: #ffc107;
            color: #000;
        }

        .status-complete {
            background: #28a745;
            color: white;
        }

        .status-error {
            background: #dc3545;
            color: white;
        }

        .streaming-text {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <div class="nav-title">NBA <em>Prediction</em> Platform</div>
            <div class="nav-links">
                <a href="/">Module 1</a>
                <a href="/module2">Module 2</a>
                <a href="/module3" class="active" aria-current="page">Module 3</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🏀 NBA Match <em>Prediction</em></h1>
            <p>Select two teams to predict the current season match result</p>
        </div>

        <div class="main-card">
            <h2 class="section-title">Select Teams</h2>

            <div class="team-selection">
                <div class="team-selector">
                    <label for="homeTeam">Home Team</label>
                    <select id="homeTeam">
                        <option value="">-- Select Home Team --</option>
                    </select>
                </div>

                <div class="vs-divider">VS</div>

                <div class="team-selector">
                    <label for="awayTeam">Away Team</label>
                    <select id="awayTeam">
                        <option value="">-- Select Away Team --</option>
                    </select>
                </div>
            </div>

            <button class="predict-btn" id="predictBtn" disabled>Start Prediction</button>

            <div id="playersDisplay" class="players-display hidden"></div>
        </div>

        <div id="searchResults" class="main-card hidden">
            <h2 class="section-title">Player News Retrieval</h2>
            <div id="searchContent"></div>
        </div>

        <div id="predictionResult" class="main-card hidden">
            <h2 class="section-title">Final Prediction</h2>
            <div id="predictionContent"></div>
        </div>
    </div>

    <script>
        let teamsData = [];
        let currentHomeTeam = null;
        let currentAwayTeam = null;
        let searchResults = {
            home: '',
            away: ''
        };

        // Load teams data
        async function loadTeams() {
            try {
                const response = await fetch('/api/module3/teams');
                const data = await response.json();

                if (data.success) {
                    teamsData = data.teams;
                    populateTeamSelectors();
                }
            } catch (error) {
                console.error('Failed to load teams:', error);
                alert('Failed to load team data');
            }
        }

        function populateTeamSelectors() {
            const homeSelect = document.getElementById('homeTeam');
            const awaySelect = document.getElementById('awayTeam');

            teamsData.forEach(team => {
                const option1 = document.createElement('option');
                option1.value = team.team;
                option1.textContent = `${team.team} (${team.conference})`;
                homeSelect.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = team.team;
                option2.textContent = `${team.team} (${team.conference})`;
                awaySelect.appendChild(option2);
            });
        }

        function displayPlayers() {
            const homeTeam = document.getElementById('homeTeam').value;
            const awayTeam = document.getElementById('awayTeam').value;

            if (!homeTeam || !awayTeam || homeTeam === awayTeam) {
                document.getElementById('playersDisplay').classList.add('hidden');
                document.getElementById('predictBtn').disabled = true;
                return;
            }

            currentHomeTeam = teamsData.find(t => t.team === homeTeam);
            currentAwayTeam = teamsData.find(t => t.team === awayTeam);

            const display = document.getElementById('playersDisplay');
            display.innerHTML = `
                <div class="team-players">
                    <h3>${currentHomeTeam.team}</h3>
                    ${currentHomeTeam.players.map(p => `
                        <div class="player-card">
                            <span class="player-name">${p.name}</span>
                            <span class="player-position">${p.position}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="team-players">
                    <h3>${currentAwayTeam.team}</h3>
                    ${currentAwayTeam.players.map(p => `
                        <div class="player-card">
                            <span class="player-name">${p.name}</span>
                            <span class="player-position">${p.position}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            display.classList.remove('hidden');
            document.getElementById('predictBtn').disabled = false;
        }

        // Event listeners
        document.getElementById('homeTeam').addEventListener('change', displayPlayers);
        document.getElementById('awayTeam').addEventListener('change', displayPlayers);

        document.getElementById('predictBtn').addEventListener('click', async () => {
            if (!currentHomeTeam || !currentAwayTeam) return;

            document.getElementById('predictBtn').disabled = true;
            document.getElementById('searchResults').classList.remove('hidden');
            document.getElementById('predictionResult').classList.add('hidden');

            // Initialize search display
            const searchContent = document.getElementById('searchContent');
            searchContent.innerHTML = `
                <div class="search-container">
                    <div class="search-section">
                        <h4>
                            <span class="status-badge status-searching">Searching</span>
                            ${currentHomeTeam.team} Player News
                        </h4>
                        <div class="search-content streaming-text" id="homeSearch">
                            <div class="loading-spinner"></div> Retrieving player news...
                        </div>
                    </div>
                    <div class="search-section">
                        <h4>
                            <span class="status-badge status-searching">Searching</span>
                            ${currentAwayTeam.team} Player News
                        </h4>
                        <div class="search-content streaming-text" id="awaySearch">
                            <div class="loading-spinner"></div> Retrieving player news...
                        </div>
                    </div>
                </div>
            `;

            searchResults = { home: '', away: '' };

            // Start streaming searches
            await performStreamingSearch();
        });

        async function performStreamingSearch() {
            try {
                const response = await fetch('/api/module3/search_news', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        home_team: currentHomeTeam.team,
                        away_team: currentAwayTeam.team,
                        home_players: currentHomeTeam.players.map(p => p.name),
                        away_players: currentAwayTeam.players.map(p => p.name)
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let allComplete = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6);
                            if (jsonStr.trim()) {
                                try {
                                    const data = JSON.parse(jsonStr);
                                    if (data.type === 'all_complete') {
                                        allComplete = true;
                                    } else {
                                        handleStreamEvent(data);
                                    }
                                } catch (e) {
                                    console.error('Parse error:', e);
                                }
                            }
                        }
                    }
                }

                // Wait a bit to ensure all UI updates are processed
                if (allComplete) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                // After streaming completes, call final prediction
                await performFinalPrediction();

            } catch (error) {
                console.error('Search failed:', error);
                alert('News retrieval failed');
                document.getElementById('predictBtn').disabled = false;
            }
        }

        function handleStreamEvent(data) {
            if (data.type === 'home_chunk') {
                searchResults.home += data.chunk;
                const homeSearch = document.getElementById('homeSearch');
                homeSearch.textContent = searchResults.home;
                homeSearch.scrollTop = homeSearch.scrollHeight;
            } else if (data.type === 'away_chunk') {
                searchResults.away += data.chunk;
                const awaySearch = document.getElementById('awaySearch');
                awaySearch.textContent = searchResults.away;
                awaySearch.scrollTop = awaySearch.scrollHeight;
            } else if (data.type === 'home_complete') {
                document.querySelector('#searchContent .search-container .search-section:nth-child(1) h4 .status-badge')
                    .className = 'status-badge status-complete';
                document.querySelector('#searchContent .search-container .search-section:nth-child(1) h4 .status-badge')
                    .textContent = 'Complete';
            } else if (data.type === 'away_complete') {
                document.querySelector('#searchContent .search-container .search-section:nth-child(2) h4 .status-badge')
                    .className = 'status-badge status-complete';
                document.querySelector('#searchContent .search-container .search-section:nth-child(2) h4 .status-badge')
                    .textContent = 'Complete';
            }
        }

        async function performFinalPrediction() {
            document.getElementById('predictionResult').classList.remove('hidden');
            document.getElementById('predictionContent').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 4px;"></div>
                    <p style="margin-top: 20px; color: #666;">Analyzing data and generating prediction...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/module3/final_prediction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        home_team: currentHomeTeam.team,
                        away_team: currentAwayTeam.team,
                        home_news: searchResults.home,
                        away_news: searchResults.away
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayPrediction(data);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('Prediction failed:', error);
                document.getElementById('predictionContent').innerHTML = `
                    <div style="color: #dc3545; text-align: center; padding: 20px;">
                        Prediction failed: ${error.message}
                    </div>
                `;
            } finally {
                document.getElementById('predictBtn').disabled = false;
            }
        }

        function displayPrediction(data) {
            const winner = data.prediction.winner === 'home' ? currentHomeTeam.team : currentAwayTeam.team;

            document.getElementById('predictionContent').innerHTML = `
                <div class="prediction-result">
                    <h3>🏆 Predicted Winner: ${winner}</h3>
                    <div class="win-probability">
                        <div class="prob-card">
                            <div>${currentHomeTeam.team}</div>
                            <div class="prob-value">${data.prediction.home_probability.toFixed(1)}%</div>
                        </div>
                        <div class="prob-card">
                            <div>${currentAwayTeam.team}</div>
                            <div class="prob-value">${data.prediction.away_probability.toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="analysis-text">
                        <strong>Analysis:</strong><br>
                        ${data.analysis}
                    </div>
                </div>
            `;
        }

        // Initialize on page load
        loadTeams();
    </script>
</body>
</html>
